<style>
  :root { --encre: #2b2d42; --papier: #efeeea; }
  html, body { height: 100%; margin: 0; background: var(--papier); font-family: "Segoe UI", system-ui, sans-serif; color: var(--encre); }
  body { display: flex; flex-direction: column; }
  #barre { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 16px;
           background: var(--encre); color: #fff; position: relative; z-index: 2000; }
  #barre .titre { font-weight: 700; font-size: 15px; margin-right: 6px; white-space: nowrap; }
  #barre .titre i { font-weight: 400; opacity: .75; }
  #barre button, #barre select, #barre input { font: inherit; font-size: 14px; border-radius: 6px; border: 1px solid #6b6e85;
           background: #3a3d55; color: #fff; padding: 6px 10px; min-height: 34px; }
  #barre button { cursor: pointer; }
  #lien-globe { color: #fff; font-size: 14px; text-decoration: none; border: 1px solid #6b6e85; border-radius: 6px; padding: 6px 10px;
                background: #3a3d55; min-height: 20px; white-space: nowrap; }
  #lien-globe:hover { background: #4a4e69; }
  #barre button:hover, #barre select:hover { background: #4a4e69; }
  #barre select { max-width: none; }
  .recherche { position: relative; flex: 1 1 240px; max-width: 420px; }
  .recherche input { width: 100%; box-sizing: border-box; }
  .recherche input::placeholder { color: #c9cad6; }
  #liste { display: none; position: absolute; top: 100%; left: 0; right: 0; margin: 4px 0 0; padding: 4px 0; list-style: none;
           max-height: 60vh; overflow-y: auto; background: #fff; color: var(--encre); border-radius: 8px;
           box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  #liste.ouvert { display: block; }
  #liste li { display: flex; align-items: center; gap: 8px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
  #liste li small { color: #6b6b6b; margin-left: auto; white-space: nowrap; }
  #liste li.sel, #liste li:hover { background: #ecebf3; }
  #liste li.vide { cursor: default; color: #6b6b6b; }
  .pastille { flex: 0 0 auto; display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid #fff; box-shadow: 0 0 0 1px #888; }
  #mapdiv { flex: 1 1 auto; min-height: 0; width: 100%; }

  /* StoryMapJS : ses marqueurs rouges sont masqués, remplacés par les ronds de la carte du Day 12 */
  .vco-mapmarker, .vco-mapmarker-active { display: none !important; }
  .genz-rond { background: none; border: 0; cursor: pointer; }
  .genz-rond svg { display: block; overflow: visible; }
  .genz-rond.actif svg { filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 5px rgba(0,0,0,.75)); }
  .genz-rond.famille svg { filter: drop-shadow(0 0 3px rgba(255,255,255,.95)); }
  .genz-rond.estompe { opacity: .3; }
  .vco-slide .genz-explication { font-size: 1.08em; line-height: 1.45; }

  #bulle { position: fixed; z-index: 3000; pointer-events: none; display: none; max-width: 250px; padding: 6px 9px;
           background: rgba(255,255,255,.97); color: var(--encre); border-radius: 6px; font-size: 12.5px; line-height: 1.35;
           box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  #bulle b { font-size: 13px; }

  /* légende : large et basse, au-dessus de la ligne « StoryMapJS | Leaflet | © OpenStreetMap » */
  .leaflet-bottom.leaflet-left .legende { margin-bottom: 30px !important; }
  .legende { background: rgba(255,255,255,.95); color: var(--encre); padding: 6px 10px 7px; border-radius: 8px; font-size: 11px;
             line-height: 1.25; box-shadow: 0 1px 8px rgba(0,0,0,.22); max-width: 760px; box-sizing: border-box; }
  .legende .tete { display: flex; align-items: center; gap: 10px; }
  .legende .tete label { display: flex; align-items: center; gap: 6px; font-weight: 600; cursor: pointer; font-size: 12.5px; }
  .legende .tete input { width: 15px; height: 15px; margin: 0; accent-color: var(--encre); cursor: pointer; }
  .legende .tete .titre-leg { font-weight: 700; }
  .legende .masquer { margin-left: auto; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-size: 14px;
                      line-height: 1; color: #444; padding: 2px 7px; }
  .legende.ferme .contenu { display: none; }
  .legende .contenu { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: flex-start; overflow-y: auto; }
  .legende .tete .note { color: #555; font-size: 10.5px; }
  .legende .col { display: grid; gap: 2px; }
  .legende .col > div { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .legende .col h5 { margin: 0 0 1px; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: #555; font-weight: 700; }
  .legende i { color: #666; }
  .biv-bloc { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
  .biv { display: grid; grid-template-columns: 13px repeat(3, 18px); grid-template-rows: repeat(3, 18px) 13px; gap: 2px; }
  .biv .case { border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .biv .fl-y { grid-column: 1; grid-row: 1 / 4; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; }
  .biv .fl-x { grid-column: 2 / 5; grid-row: 4; text-align: center; font-size: 17px; font-weight: 700; line-height: 14px; }
  .axes { font-size: 11px; line-height: 1.28; }
  .axes b { font-size: 13px; }
  .legende.sans-aplats .biv, .legende.sans-aplats .axes { opacity: .35; }
  .legende svg.anneau { flex: 0 0 auto; }
  .legende .trait { display: inline-block; width: 22px; height: 0; border-top: 3px solid; position: relative; }
  .legende .trait::after { content: ""; position: absolute; right: -2px; top: -6px; border: 4.5px solid transparent; border-left: 7px solid currentColor; }
  @media (max-width: 700px) {
    #barre { padding: 6px 16px; gap: 6px; }
    #barre .titre { width: 100%; font-size: 14px; }

    .recherche { flex: 1 1 100%; max-width: none; }
    .legende { font-size: 11px; padding: 6px 9px; }

  }

  /* panneau de droite : tout le texte visible sans défiler (police adaptative) */
  .vco-slide .vco-slide-content .vco-text .vco-headline-title, .vco-slide .vco-text h2.vco-headline-title {
    font-size: clamp(18px, 1.1vw + 8px, 28px) !important; line-height: 1.1 !important; margin-bottom: .3em !important; }
  .vco-slide .vco-text .vco-text-content p, .vco-slide .vco-text .vco-text-content li {
    font-size: clamp(11px, 0.3vw + 8.3px, 14.5px) !important; line-height: 1.34 !important; margin: 0 0 .4em !important; }
  .vco-slide .vco-text .vco-text-content ul { margin: 0 0 .45em !important; padding-left: 1.1em; }
  .vco-slide .genz-explication { font-size: clamp(11.5px, 0.34vw + 8.6px, 15.5px) !important; line-height: 1.38 !important; }
  .vco-slide .vco-text-content ul li { font-size: clamp(10.5px, 0.25vw + 8px, 13.5px) !important; line-height: 1.28 !important; margin: 0 !important; }
  .vco-slide .vco-media .vco-media-image { max-height: 28vh !important; width: auto; cursor: zoom-in; }
  .vco-slide .vco-media .vco-media-iframe iframe { height: 46vh !important; min-height: 260px; }
  .vco-slide .vco-media .vco-caption, .vco-slide .vco-media .vco-credit { font-size: 11px !important; line-height: 1.25 !important; }
  .vco-slide .genz-sources p { font-size: clamp(10.5px, 0.2vw + 8.4px, 13px) !important; line-height: 1.3 !important; }
  .vco-slide .genz-credits { columns: 3; column-gap: 14px; }
  .vco-slide .vco-text .vco-text-content ul.genz-credits li { font-size: 9.5px !important; line-height: 1.2 !important; margin: 0 !important; break-inside: avoid; }
  .vco-slide .genz-agrandir { font-size: 11px; opacity: .85; }

  /* visionneuse d'images plein écran (zoom molette / pincement, déplacement) */
  #visionneuse { position: fixed; inset: 0; z-index: 4000; background: rgba(20,21,33,.95); display: none; touch-action: none; overflow: hidden; }
  #visionneuse.ouvert { display: block; }
  #visionneuse img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; user-select: none; -webkit-user-drag: none;
                     cursor: grab; box-shadow: 0 4px 30px rgba(0,0,0,.5); }
  #visionneuse img.saisi { cursor: grabbing; }
  #visionneuse .outils { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; z-index: 2; }
  #visionneuse .outils button { font: inherit; font-size: 18px; width: 42px; height: 42px; border-radius: 50%; border: 1px solid #888;
                                background: rgba(255,255,255,.92); color: var(--encre); cursor: pointer; }
  #visionneuse .legende-img { position: absolute; left: 16px; right: 16px; bottom: 12px; color: #fff; font-size: 13px; text-align: center;
                              text-shadow: 0 1px 3px #000; pointer-events: none; }
</style>

<body>

    <button type="button" data-z="1.4" title="Zoomer" aria-label="Zoomer">+</button>
    <button type="button" data-z="0.71" title="Dézoomer" aria-label="Dézoomer">−</button>
    <button type="button" data-z="0" title="Ajuster à l'écran" aria-label="Ajuster à l'écran">⤢</button>

  </div>

<script>
(function () {
  "use strict";
  var MOBILE = window.innerWidth < 700;
  var storymap, carte, D, coucheAplats = null, coucheLignes = null, coucheRappels = null;
  var ronds = [], rondsParSlide = {}, slideCourante = -1;
  var bulle = document.getElementById("bulle");
  var echap = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var sansAccent = function (s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); };
  var json = function (u) { return fetch(u, { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(u + " : " + r.status); return r.json(); }); };

  Promise.all([json("storymap_genz_v2.json"), json("genz_v2_donnees.json")]).then(function (res) {
    D = res[1];
    normaliserPictos();
    var Classe = window.KLStoryMap ? KLStoryMap.StoryMap : VCO.StoryMap;
    var depart = parseInt(new URLSearchParams(location.search).get("diapo"), 10);   // ?diapo=12 ouvre la 12e diapositive
    storymap = new Classe("mapdiv", res[0], { language: "fr", map_type: "osm:standard", calculate_zoom: false,
                                              show_lines: false, show_history_line: false });
    window.genzDepart = isNaN(depart) ? 0 : depart;
    // clic dans les graphiques interactifs (iframes de la même origine) : ouvrir la diapositive du mouvement
    window.addEventListener("message", function (e) {
      if (e.origin === location.origin && e.data && e.data.genz === "aller") allerA(e.data.slide);
    });
    window.storymap = storymap;
    window.addEventListener("resize", function () { storymap.updateDisplay(); });
    recalerMiseEnPage();
    document.addEventListener("visibilitychange", function () { if (!document.hidden) recalerMiseEnPage(); });
    preparerNavigation();
    preparerVisionneuse();
    attendreCarte();
  }).catch(function (e) {
    document.getElementById("mapdiv").innerHTML = '<p style="padding:16px">Impossible de charger les données (' + echap(e.message) +
      '). Ouvrez la page via un serveur web (GitHub Pages ou <code>py -m http.server</code>), pas en double-clic.</p>';
  });

  // la feuille de style de StoryMapJS arrive parfois après l'initialisation : on recalcule la mise en page
  function recalerMiseEnPage() {
    var essais = 0, t = setInterval(function () {
      storymap.updateDisplay();
      var s = document.querySelectorAll(".vco-slide");
      if (++essais > 40 || (s.length > 1 && s[1].style.left && s[1].style.left !== "0px" && essais > 4)) clearInterval(t);
    }, 250);
  }

  function attendreCarte() {
    var m = storymap && storymap._map && storymap._map._map;
    if (!m || !window.L || !m._loaded) { setTimeout(attendreCarte, 150); return; }   // carte centrée et zoomée
    carte = m;
    coucheRappels = L.layerGroup().addTo(carte);
    json("pays_bivarie.geojson").then(ajouterAplats).catch(function (e) { console.warn(e); });
    creerRonds();
    ajouterLegende();
    carte.on("zoomend", placerRonds);
    carte.on("moveend", recentrerMiniCarte);
    setInterval(suivreSlide, 250);
    if (window.genzDepart > 0) setTimeout(function () { allerA(window.genzDepart); }, 400);
  }

  // ---------- pictos : viewBox recadrée sur le dessin réel, pour un centrage exact -----------------
  function normaliserPictos() {
    var ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
    svg.setAttribute("style", "position:absolute;left:-9999px;top:0;width:100px;height:100px;visibility:hidden");
    document.body.appendChild(svg);
    Object.keys(D.pictos).forEach(function (k) {
      var p = D.pictos[k], g = document.createElementNS(ns, "g");
      g.innerHTML = p.corps; svg.appendChild(g);
      try {
        var b = g.getBBox();
        if (b.width > 0 && b.height > 0) {
          var c = Math.max(b.width, b.height) * 1.04;
          p.viewBox = [b.x + b.width / 2 - c / 2, b.y + b.height / 2 - c / 2, c, c].map(function (v) { return v.toFixed(2); }).join(" ");
        }
      } catch (e) { /* on garde la viewBox d'origine */ }
      svg.removeChild(g);
    });
    document.body.removeChild(svg);
  }

  // ---------- 1. aplats bivariés -------------------------------------------------------------
  function ajouterAplats(geo) {
    geo.features = geo.features.filter(function (f) { return f.geometry && f.geometry.coordinates; });
    coucheAplats = L.geoJson(geo, {
      style: function (f) {
        var c = D.bivar[f.properties.bivar];
        return { fillColor: c || "#ffffff", fillOpacity: c ? 0.62 : 0.15, color: "#4a4a4a", weight: 0.7, opacity: 0.55 };
      },
      onEachFeature: function (f, lyr) {
        lyr.on("mouseover", function (e) { lyr.setStyle({ weight: 2, color: "#2b2d42", opacity: 0.95 }); montrerBulle(textePays(f.properties), e); });
        lyr.on("mousemove", placerBulle);
        lyr.on("mouseout", function () { coucheAplats.resetStyle(lyr); cacherBulle(); });
      }
    });
    var cb = document.getElementById("cb-aplats");
    if (!cb || cb.checked) coucheAplats.addTo(carte).bringToBack();
  }
  function basculerAplats(oui) {
    var leg = document.querySelector(".legende");
    if (leg) leg.classList.toggle("sans-aplats", !oui);
    if (!coucheAplats) return;
    if (oui) { carte.addLayer(coucheAplats); coucheAplats.bringToBack(); } else carte.removeLayer(coucheAplats);
  }
  function textePays(p) {
    var fmt = function (v, u) { return v == null ? "n. d." : String(v).replace(".", ",") + u; };
    return "<b>" + echap(p.NAME) + "</b><br>Âge médian : " + fmt(p.age_median, " ans") +
           "<br>Chômage des 15–24 ans : " + fmt(p.chom_jeunes, " %") +
           "<br><i style='color:#777'>median age · youth unemployment</i>";
  }

  // ---------- 2. ronds de la carte du Day 12, sans chevauchement ------------------------------
  // pixels par millimètre de la carte imprimée, selon le zoom : petits ronds en vue monde
  function pxParMm(z) { var k = Math.max(1.35, Math.min(3.6, 0.9 + 0.5 * z)); return MOBILE ? k * 0.85 : k; }

  function svgRond(m, K) {
    var d = m.d_mm * K, halo = (m.cas_limite ? m.d_mm + 1 : m.d_mm + (m.epoque === "2026" ? 4.6 : 3.0)) * K;
    var T = Math.ceil(halo + 2), c = T / 2;
    var s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + T + '" height="' + T + '" viewBox="0 0 ' + T + " " + T + '">';
    s += '<circle cx="' + c + '" cy="' + c + '" r="' + halo / 2 + '" fill="#ffffff" fill-opacity="0.92"/>';
    if (m.anneau) {
      var w = Math.max(0.8, m.anneau_mm * K), dash = "";
      if (m.anneau === "dot") dash = ' stroke-dasharray="0.1 ' + (w * 2.2).toFixed(2) + '" stroke-linecap="round"';
      if (m.anneau === "dash") dash = ' stroke-dasharray="' + (w * 5).toFixed(2) + " " + (w * 2.5).toFixed(2) + '"';
      s += '<circle cx="' + c + '" cy="' + c + '" r="' + ((d + 1.9 * K) / 2).toFixed(2) + '" fill="none" stroke="' + D.encre + '" stroke-width="' + w + '"' + dash + "/>";
      if (m.anneau === "double")
        s += '<circle cx="' + c + '" cy="' + c + '" r="' + ((d + 3.5 * K) / 2).toFixed(2) + '" fill="none" stroke="' + D.encre + '" stroke-width="' + w + '"/>';
    }
    s += '<circle cx="' + c + '" cy="' + c + '" r="' + (d / 2).toFixed(2) + '" fill="' + m.remplissage + '" stroke="' +
         (m.cas_limite ? "#6b6b6b" : "#ffffff") + '" stroke-width="' + Math.max(0.5, 0.15 * K) + '"/>';
    var p = m.picto && D.pictos[m.picto];
    if (p && d >= 9) {                       // picto centré, carré inscrit dans le rond (côté = 0,62 × diamètre)
      var t = d * 0.62;
      s += '<svg x="' + (c - t / 2).toFixed(2) + '" y="' + (c - t / 2).toFixed(2) + '" width="' + t.toFixed(2) + '" height="' + t.toFixed(2) +
           '" viewBox="' + p.viewBox + '" preserveAspectRatio="xMidYMid meet" overflow="hidden" style="color:' + m.picto_couleur + '">' + p.corps + "</svg>";
    }
    return { html: s + "</svg>", taille: T, rayon: halo / 2 };
  }

  function creerRonds() {
    // ordre d'affichage : les petits ronds au-dessus des gros, comme sur la carte
    D.mouvements.slice().sort(function (a, b) { return b.d_mm - a.d_mm; }).forEach(function (m, i) {
      var mk = L.marker([m.lat, m.lon], { icon: L.divIcon({ className: "genz-rond", iconSize: [1, 1] }),
                                         zIndexOffset: 1000 + i * 10, riseOnHover: true, title: "" }).addTo(carte);
      mk.on("click", function () { allerA(m.slide); });
      mk.on("mouseover", function (e) { montrerBulle(texteMouvement(m), e); });
      mk.on("mousemove", placerBulle);
      mk.on("mouseout", cacherBulle);
      var r = { marker: mk, m: m, z: 1000 + i * 10 };
      ronds.push(r); rondsParSlide[m.slide] = r;
    });
    placerRonds();
  }

  // Anti-collision : on part du vrai lieu, on écarte les ronds qui se touchent (ressort vers le vrai lieu),
  // puis une passe finale sans ressort garantit qu'aucun rond n'en chevauche un autre. Recalculé à chaque zoom.
  function placerRonds() {
    var K = pxParMm(carte.getZoom()), marge = 1.5;
    var N = ronds.map(function (r, i) {
      var p = carte.latLngToLayerPoint([r.m.lat, r.m.lon]), s = svgRond(r.m, K);
      return { r: r, x0: p.x, y0: p.y, x: p.x, y: p.y, rayon: s.rayon + marge, s: s, i: i };
    });
    function separer() {
      var touche = false;
      for (var a = 0; a < N.length; a++) for (var b = a + 1; b < N.length; b++) {
        var A = N[a], B = N[b], dx = B.x - A.x, dy = B.y - A.y, dist = Math.sqrt(dx * dx + dy * dy), besoin = A.rayon + B.rayon;
        if (dist < besoin) {
          touche = true;
          if (dist < 0.01) { var ang = (a * 2.399 + b * 0.7); dx = Math.cos(ang); dy = Math.sin(ang); dist = 1; }
          var pousse = (besoin - dist) / 2 + 0.05, ux = dx / dist, uy = dy / dist;
          A.x -= ux * pousse; A.y -= uy * pousse; B.x += ux * pousse; B.y += uy * pousse;
        }
      }
      return touche;
    }
    for (var it = 0; it < 250; it++) {
      separer();
      N.forEach(function (n) { n.x += (n.x0 - n.x) * 0.06; n.y += (n.y0 - n.y) * 0.06; });
    }
    for (it = 0; it < 3000 && separer(); it++) { /* passe finale : plus aucun chevauchement */ }

    coucheRappels.clearLayers();
    N.forEach(function (n) {
      var ll = carte.layerPointToLatLng(L.point(n.x, n.y));
      n.r.marker.setLatLng(ll);
      n.r.rayonPx = n.s.rayon;
      n.r.marker.setIcon(L.divIcon({ className: "genz-rond", html: n.s.html, iconSize: [n.s.taille, n.s.taille],
                                     iconAnchor: [n.s.taille / 2, n.s.taille / 2] }));
      var ecart = Math.sqrt((n.x - n.x0) * (n.x - n.x0) + (n.y - n.y0) * (n.y - n.y0));
      if (ecart > n.rayon * 0.6) {           // petit trait de rappel vers la vraie position
        var vrai = L.latLng(n.r.m.lat, n.r.m.lon);
        coucheRappels.addLayer(L.polyline([vrai, ll], { color: "#2b2d42", weight: 1, opacity: 0.7, clickable: false }));
        coucheRappels.addLayer(L.circleMarker(vrai, { radius: 2, stroke: false, fillColor: "#2b2d42", fillOpacity: 0.9, clickable: false }));
      }
    });
    appliquerEtats();
    if (slideCourante >= 0) montrerFamille(familleCourante());
  }
  function texteMouvement(m) {
    return "<b>" + echap(m.nom) + "</b><br>" + echap(m.pays) + " · " + echap(m.annee) + "<br>" +
           (m.cas_limite ? "cas limite · " : "") + echap(m.issue) + " · " + m.duree + " j" +
           "<br><i style='color:#777'>cliquer pour ouvrir · click to open</i>";
  }
  function classeRond(r, nom, oui) {
    var el = r && r.marker._icon;
    if (el) { if (oui) L.DomUtil.addClass(el, nom); else L.DomUtil.removeClass(el, nom); }
  }

  // ---------- 3. lignes des symboles qui voyagent --------------------------------------------
  function arc(a, b) {   // courbe douce entre deux points (Bézier quadratique en lat/lon)
    var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[1] - a[1], dy = b[0] - a[0];
    var c = [mx + dx * 0.18, my - dy * 0.18], pts = [];
    for (var t = 0; t <= 1.0001; t += 0.05)
      pts.push([(1 - t) * (1 - t) * a[0] + 2 * (1 - t) * t * c[0] + t * t * b[0],
                (1 - t) * (1 - t) * a[1] + 2 * (1 - t) * t * c[1] + t * t * b[1]]);
    return pts;
  }
  function familleCourante() {
    var fam = null;
    D.familles.forEach(function (f) { if (f.slide === slideCourante) fam = f; });
    return fam;
  }
  function rondAt(ll) {
    for (var i = 0; i < ronds.length; i++) if (ronds[i].m.lat === ll[0] && ronds[i].m.lon === ll[1]) return ronds[i];
    return null;
  }
  // ligne courbe origine → destination entre les ronds (positions décalées), coupée au bord des ronds,
  // avec une tête de flèche de la couleur du symbole. Recalculée à chaque zoom (dimensions en pixels).
  function montrerFamille(f) {
    if (coucheLignes) { carte.removeLayer(coucheLignes); coucheLignes = null; }
    if (!f) return;
    var couches = [];
    f.segments.forEach(function (s) {
      var A = rondAt(s[0]), B = rondAt(s[1]);
      var pa = carte.latLngToLayerPoint(A ? A.marker.getLatLng() : s[0]), pb = carte.latLngToLayerPoint(B ? B.marker.getLatLng() : s[1]);
      var dx = pb.x - pa.x, dy = pb.y - pa.y, lg = Math.sqrt(dx * dx + dy * dy);
      if (lg < 4) return;
      var cx = (pa.x + pb.x) / 2 - dy * 0.18, cy = (pa.y + pb.y) / 2 + dx * 0.18;
      var rA = (A && A.rayonPx || 6) + 1, rB = (B && B.rayonPx || 6) + 2, pts = [];
      for (var t = 0; t <= 1.0001; t += 0.02) {
        var x = (1 - t) * (1 - t) * pa.x + 2 * (1 - t) * t * cx + t * t * pb.x, y = (1 - t) * (1 - t) * pa.y + 2 * (1 - t) * t * cy + t * t * pb.y;
        if (Math.hypot(x - pa.x, y - pa.y) >= rA && Math.hypot(x - pb.x, y - pb.y) >= rB) pts.push(L.point(x, y));
      }
      if (pts.length < 2) return;
      var bout = pts[pts.length - 1], prec = pts[Math.max(0, pts.length - 4)];
      var ux = bout.x - prec.x, uy = bout.y - prec.y, n = Math.sqrt(ux * ux + uy * uy) || 1; ux /= n; uy /= n;
      var long = 12, demi = 6.5, base = L.point(bout.x - ux * long, bout.y - uy * long);
      var ligne = pts.slice(0, -1); ligne.push(base);
      couches.push(L.polyline(ligne.map(function (p) { return carte.layerPointToLatLng(p); }),
                              { color: f.couleur, weight: 3.5, opacity: 0.92, lineCap: "round", clickable: false }));
      couches.push(L.polygon([bout, L.point(base.x - uy * demi, base.y + ux * demi), L.point(base.x + uy * demi, base.y - ux * demi)]
                               .map(function (p) { return carte.layerPointToLatLng(p); }),
                             { color: f.couleur, weight: 1, opacity: 1, fillColor: f.couleur, fillOpacity: 1, clickable: false }));
    });
    coucheLignes = L.layerGroup(couches).addTo(carte);
  }
  // classes CSS (actif, famille, estompé) : réappliquées après chaque recalcul des icônes
  function appliquerEtats() {
    var f = familleCourante();
    ronds.forEach(function (r) {
      var actif = r.m.slide === slideCourante, dedans = f && f.slides_mouvements.indexOf(r.m.slide) >= 0;
      classeRond(r, "actif", actif);
      classeRond(r, "famille", !!dedans);
      classeRond(r, "estompe", !!f && !dedans);
      r.marker.setZIndexOffset(actif ? 5000 : r.z);
    });
  }

  // ---------- suivi de la diapositive courante -----------------------------------------------
  function suivreSlide() {
    var n = storymap.current_slide;
    if (n === slideCourante) return;
    slideCourante = n;
    montrerFamille(familleCourante());
    appliquerEtats();
    var sel = document.getElementById("chapitres"), v = "";
    D.chapitres.forEach(function (c) { if (c.slide <= n) v = String(c.slide); });
    sel.value = v;
    [400, 1500, 3000].forEach(function (t) { setTimeout(recentrerMiniCarte, t); });
  }
  function allerA(n) {   // si la carte n'est pas encore prête, on attend un peu
    if (!carte) { setTimeout(function () { allerA(n); }, 200); return; }
    storymap.goTo(+n); setTimeout(suivreSlide, 50);
  }

  // ---------- 7. minicarte : toujours centrée sur la vue principale (point rouge visible partout) ----
  function recentrerMiniCarte() {
    var mc = storymap._map && storymap._map._mini_map, mm = mc && mc._miniMap;
    if (!mm || !carte) return;
    try {
      var c = carte.getCenter(), z = Math.max(0, Math.min(carte.getZoom() - 5, 3));
      mm.setView(c, z, { reset: true });
      if (mc._locationCircle) { mc._locationCircle.setLatLng(c); mc._locationCircle.redraw(); }
      if (mc._aimingRect) mc._aimingRect.setBounds(carte.getBounds());
      if (mc._shadowRect) mc._shadowRect.setBounds(carte.getBounds());
    } catch (e) { /* minicarte masquée */ }
  }

  // ---------- bulle --------------------------------------------------------------------------
  function montrerBulle(html, e) { bulle.innerHTML = html; bulle.style.display = "block"; placerBulle(e); }
  function placerBulle(e) {
    var x = e.originalEvent.clientX + 14, y = e.originalEvent.clientY + 14;
    var w = bulle.offsetWidth, h = bulle.offsetHeight;
    if (x + w > window.innerWidth - 8) x = e.originalEvent.clientX - w - 14;
    if (y + h > window.innerHeight - 8) y = e.originalEvent.clientY - h - 14;
    bulle.style.left = x + "px"; bulle.style.top = y + "px";
  }
  function cacherBulle() { bulle.style.display = "none"; }

  // ---------- légende ------------------------------------------------------------------------
  function anneauSvg(style) {   // petit rond d'exemple avec l'anneau d'époque de la carte
    var dash = style === "dot" ? ' stroke-dasharray="0.1 2.6" stroke-linecap="round"' : style === "dash" ? ' stroke-dasharray="4 2.2"' : "";
    var s = '<svg class="anneau" width="18" height="18" viewBox="0 0 22 22"><circle cx="11" cy="11" r="5" fill="#bdb9ad"/>' +
            '<circle cx="11" cy="11" r="7.3" fill="none" stroke="' + D.encre + '" stroke-width="' + (style === "solid" ? 1.6 : 1.3) + '"' + dash + "/>";
    if (style === "double") s += '<circle cx="11" cy="11" r="9.6" fill="none" stroke="' + D.encre + '" stroke-width="1.1"/>';
    return s + "</svg>";
  }
  function ajouterLegende() {
    var ctl = L.control({ position: "bottomleft" });
    ctl.onAdd = function () {
      var div = L.DomUtil.create("div", "legende");
      var g = '<div class="biv-bloc"><div class="biv" role="img" aria-label="Légende bivariée : âge médian et chômage des 15–24 ans">' +
              '<span class="fl-y" aria-hidden="true">↑</span>';
      for (var y = 3; y >= 1; y--) for (var x = 1; x <= 3; x++)
        g += '<span class="case" style="background:' + D.bivar[x + "-" + y] + ';grid-column:' + (x + 1) + ';grid-row:' + (4 - y) + '"></span>';
      g += '<span class="fl-x" aria-hidden="true">→</span></div>' +
           '<div class="axes"><b>↑</b> plus jeune · <i>younger</i><br>' +
           '<b>→</b> chômage 15–24 ans<br><i>youth unemployment</i></div></div>';
      var iss = '<div class="col"><h5>Issue · <i>outcome</i></h5>';
      Object.keys(D.issues).forEach(function (k) {
        iss += '<div><span class="pastille" style="background:' + D.coul_issue[k] + '"></span>' + echap(D.issues[k][0]) + "</div>";
      });
      iss += '<div><span class="pastille" style="background:' + D.coul_issue.cas_limite + '"></span>cas limite</div></div>';
      var styles = { precurseurs: "dot", vague1: "dash", vague2: "solid", "2026": "double" };
      var ep = '<div class="col"><h5>Anneau = époque · <i>period</i></h5>';
      var court = { precurseurs: "précurseurs", vague1: "1re vague", vague2: "vague Gen Z", "2026": "vague européenne" };
      D.epoques.forEach(function (e) { ep += "<div>" + anneauSvg(styles[e.code]) + echap(e.annees) + " " + echap(court[e.code] || e.fr) + "</div>"; });
      ep += "</div>";
      var fam = '<div class="col"><h5>Symbole qui voyage</h5>';
      D.familles.forEach(function (f) { fam += '<div><span class="trait" style="color:' + f.couleur + '"></span>' + echap(f.fr) + "</div>"; });
      fam += "</div>";
      div.innerHTML = '<div class="tete"><span class="titre-leg">Légende · <i>Key</i></span>' +
        '<label><input id="cb-aplats" type="checkbox" checked> Aplats âge × chômage</label>' +
        '<span class="note">taille = durée · trait fin = vrai lieu</span>' +
        '<button class="masquer" type="button" aria-expanded="true" title="Replier / déplier la légende">–</button></div>' +
        "<div class='contenu'>" + g + iss + ep + fam + "</div>";
      L.DomEvent.disableClickPropagation(div);
      if (L.DomEvent.disableScrollPropagation) L.DomEvent.disableScrollPropagation(div);
      var b = div.querySelector(".masquer");
      function ajuster() {   // largeur = partie visible de la carte (à gauche du panneau) ; jamais plus haute que la carte
        var panneau = document.querySelector(".vco-storyslider .vco-slide .vco-slide-content-container");
        var visible = carte.getSize().x;
        if (panneau && !MOBILE) { var r = panneau.getBoundingClientRect(), c = carte.getContainer().getBoundingClientRect();
          if (r.left > c.left + 200 && r.left < c.right) visible = r.left - c.left; }
        div.style.maxWidth = Math.max(260, visible - 30) + "px";
        div.querySelector(".contenu").style.maxHeight = Math.max(80, carte.getSize().y - 110) + "px";
      }
      b.addEventListener("click", function () {
        var f = div.classList.toggle("ferme"); b.textContent = f ? "+" : "–"; b.setAttribute("aria-expanded", String(!f)); ajuster();
      });
      div.querySelector("#cb-aplats").addEventListener("change", function (e) { basculerAplats(e.target.checked); });
      setTimeout(ajuster, 600); setTimeout(ajuster, 2500); window.addEventListener("resize", ajuster);
      var tc = carte.getSize();   // légende repliée d'office sur téléphone ou carte très petite
      if (MOBILE || tc.y < 420) { div.classList.add("ferme"); b.textContent = "+"; b.setAttribute("aria-expanded", "false"); }
      return div;
    };
    ctl.addTo(carte);
  }

  // ---------- visionneuse d'images plein écran ------------------------------------------------
  function preparerVisionneuse() {
    var v = document.getElementById("visionneuse"), img = v.querySelector("img"), leg = v.querySelector(".legende-img");
    var z = 1, tx = 0, ty = 0, pointeurs = {};
    function appliquer() { img.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + z + ")"; }
    function ajusterEcran() {
      var w = img.naturalWidth || 1, h = img.naturalHeight || 1;
      z = Math.min(window.innerWidth * 0.94 / w, window.innerHeight * 0.86 / h);
      tx = (window.innerWidth - w * z) / 2; ty = (window.innerHeight - h * z) / 2; appliquer();
    }
    function zoomer(f, cx, cy) {
      var nz = Math.max(0.05, Math.min(20, z * f));
      tx = cx - (cx - tx) * nz / z; ty = cy - (cy - ty) * nz / z; z = nz; appliquer();
    }
    function ouvrir(src, texte) {
      img.onload = ajusterEcran; img.src = src; leg.textContent = texte || ""; v.classList.add("ouvert");
      if (img.complete && img.naturalWidth) ajusterEcran();
    }
    function fermer() { v.classList.remove("ouvert"); img.removeAttribute("src"); }
    window.genzVisionneuse = ouvrir;
    document.addEventListener("click", function (e) {
      var im = e.target.closest && e.target.closest(".vco-slide .vco-media img");
      if (!im || v.contains(im)) return;
      e.preventDefault(); e.stopPropagation();
      var slide = im.closest(".vco-slide"), cap = slide && slide.querySelector(".vco-caption");
      ouvrir((im.currentSrc || im.src).replace(/width=\d+/, "width=2560"), cap ? cap.textContent : "");
    }, true);
    v.addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (b) { if (b.hasAttribute("data-fermer")) fermer(); else if (+b.dataset.z === 0) ajusterEcran();
               else zoomer(+b.dataset.z, window.innerWidth / 2, window.innerHeight / 2); }
      else if (e.target === v) fermer();
    });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && v.classList.contains("ouvert")) fermer(); });
    v.addEventListener("wheel", function (e) { e.preventDefault(); zoomer(e.deltaY < 0 ? 1.18 : 1 / 1.18, e.clientX, e.clientY); }, { passive: false });
    img.addEventListener("dblclick", function (e) { zoomer(2, e.clientX, e.clientY); });
    img.addEventListener("pointerdown", function (e) {
      img.setPointerCapture(e.pointerId); pointeurs[e.pointerId] = [e.clientX, e.clientY]; img.classList.add("saisi");
    });
    img.addEventListener("pointermove", function (e) {
      if (!pointeurs[e.pointerId]) return;
      var ids = Object.keys(pointeurs), avant = pointeurs[e.pointerId];
      if (ids.length === 1) { tx += e.clientX - avant[0]; ty += e.clientY - avant[1]; appliquer(); }
      else if (ids.length === 2) {   // pincement à deux doigts
        var autre = pointeurs[ids[0] == e.pointerId ? ids[1] : ids[0]];
        var d1 = Math.hypot(avant[0] - autre[0], avant[1] - autre[1]), d2 = Math.hypot(e.clientX - autre[0], e.clientY - autre[1]);
        if (d1 > 0) zoomer(d2 / d1, (e.clientX + autre[0]) / 2, (e.clientY + autre[1]) / 2);
      }
      pointeurs[e.pointerId] = [e.clientX, e.clientY];
    });
    ["pointerup", "pointercancel"].forEach(function (t) {
      img.addEventListener(t, function (e) { delete pointeurs[e.pointerId]; if (!Object.keys(pointeurs).length) img.classList.remove("saisi"); });
    });
    window.addEventListener("resize", function () { if (v.classList.contains("ouvert")) ajusterEcran(); });
  }

  // ---------- barre de navigation ------------------------------------------------------------
  function preparerNavigation() {
    document.getElementById("btn-ensemble").addEventListener("click", function () { allerA(0); });
    var sel = document.getElementById("chapitres");
    D.chapitres.forEach(function (c) {
      var o = document.createElement("option"); o.value = c.slide; o.textContent = c.label; sel.appendChild(o);
    });
    sel.addEventListener("change", function () { if (sel.value !== "") allerA(sel.value); });

    var inp = document.getElementById("cherche"), ul = document.getElementById("liste"), choix = -1, items = [];
    var tous = D.mouvements.slice().sort(function (a, b) { return a.slide - b.slide; });
    function afficher() {
      var q = sansAccent(inp.value.trim());
      items = tous.filter(function (m) {
        return !q || sansAccent([m.nom, m.nom_en, m.pays, m.ville, m.annee, m.issue].join(" ")).indexOf(q) >= 0;
      });
      choix = items.length ? 0 : -1;
      ul.innerHTML = items.length ? items.map(function (m, i) {
        return '<li role="option" data-i="' + i + '"' + (i === choix ? ' class="sel"' : "") + '><span class="pastille" style="background:' +
          m.remplissage + '"></span>' + echap(m.nom) + "<small>" + echap(m.pays) + " · " + m.annee + (m.cas_limite ? " · cas limite" : "") + "</small></li>";
      }).join("") : '<li class="vide">Aucun mouvement trouvé</li>';
      ul.classList.add("ouvert"); inp.setAttribute("aria-expanded", "true");
    }
    function fermer() { ul.classList.remove("ouvert"); inp.setAttribute("aria-expanded", "false"); }
    function valider(i) { if (items[i]) { allerA(items[i].slide); inp.value = items[i].nom; fermer(); inp.blur(); } }
    function surligner() {
      [].forEach.call(ul.children, function (li, i) { li.classList.toggle("sel", i === choix); });
      if (ul.children[choix]) ul.children[choix].scrollIntoView({ block: "nearest" });
    }
    inp.addEventListener("focus", function () { inp.select(); afficher(); });
    inp.addEventListener("input", afficher);
    inp.addEventListener("keydown", function (e) {
      if (e.key === "ArrowDown") { choix = Math.min(items.length - 1, choix + 1); surligner(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { choix = Math.max(0, choix - 1); surligner(); e.preventDefault(); }
      else if (e.key === "Enter") { valider(choix); e.preventDefault(); }
      else if (e.key === "Escape") { fermer(); inp.blur(); }
    });
    ul.addEventListener("mousedown", function (e) {
      var li = e.target.closest("li[data-i]"); if (li) { e.preventDefault(); valider(+li.dataset.i); }
    });
    inp.addEventListener("blur", function () { setTimeout(fermer, 120); });
  }
})();
</script>
